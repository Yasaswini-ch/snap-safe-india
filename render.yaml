services:
  - type: web
    name: snap-safe-india
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      # Without OPEN_API_KEY only the recorded samples play, which is the safe default for a public page.
      - key: OPEN_API_KEY  # your Google AI Studio key; set it as a secret here, never in this file
        sync: false
      - key: OPEN_API_KEYS  # optional: several keys from different Google projects, comma separated; they take turns and cover for each other
        sync: false
      - key: OPEN_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      # Gemma 4 (open weights) through the Gemini API is the default: its free quota is far larger than Gemini 3 Flash's. For the more precise
      # (and tighter-quota) Gemini 3 Flash, set OPEN_MODEL=gemini-3-flash-preview and OPEN_LABEL="Gemini 3 Flash".
      - key: OPEN_MODEL
        value: gemma-4-26b-a4b-it
      - key: OPEN_LABEL
        value: Gemma 4
      - key: OPEN_HOST
        value: Google AI Studio
      - key: OPEN_RPM  # requests a minute per key for this model; 8 stayed under Gemma 4's limit in our runs (Gemini 3 Flash needs 4)
        value: "8"
      # Live runs are open to everyone, so these two limits are what protect the keys. A check sends about 6 to 12 requests. Gemma 4's free
      # quota is much larger than Gemini 3 Flash's 20 a day per key, but not unlimited: watch it, and lower RUNS_PER_DAY if it runs dry.
      # Optional WhatsApp bot (docs/whatsapp.md): set all four as secrets to switch it on; until then /whatsapp/webhook answers 404.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RUNS_PER_HOUR
        value: "2"
      - key: RUNS_PER_DAY
        value: "20"
