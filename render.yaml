services:
  - type: web
    name: snap-safe-india
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      # Without OPEN_API_KEY only the recorded samples play, which is the safe default for a public page.
      - key: OPEN_API_KEY  # your Google AI Studio key; set it as a secret here, never in this file
        sync: false
      - key: OPEN_API_KEYS  # optional: several keys from different Google projects, comma separated; they take turns and cover for each other
        sync: false
      - key: OPEN_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      # Gemini 3 Flash is the main model: fast, with boxes that sit on the text. When its quota is used up on every key, Gemma 4 (open weights,
      # through the same API, with a much larger free quota) answers instead, and the page says so after the run.
      - key: OPEN_MODEL
        value: gemini-3-flash-preview
      - key: OPEN_LABEL
        value: Gemini 3 Flash
      - key: OPEN_FALLBACK_MODEL
        value: gemma-4-26b-a4b-it
      - key: OPEN_HOST
        value: Google AI Studio
      - key: OPEN_RPM  # requests a minute per key and per model; the free tier allows 5 a minute for Gemini 3 Flash
        value: "4"
      # Live runs are open to everyone, so these two limits are what protect the keys. A check sends about 6 to 12 requests. Free Gemini 3 Flash
      # allows 20 a day per key, about two checks; after that Gemma 4 answers, with a larger quota that is still not unlimited.
      # Optional WhatsApp bot (docs/whatsapp.md): set all four as secrets to switch it on; until then /whatsapp/webhook answers 404.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: RUNS_PER_HOUR
        value: "2"
      - key: RUNS_PER_DAY
        value: "12"
