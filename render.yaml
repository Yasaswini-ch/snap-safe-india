services:
  - type: web
    name: snap-safe-india
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      # Without OPEN_API_KEY only the recorded samples play, which is the safe default for a public page.
      - key: OPEN_API_KEY  # your Google AI Studio key; set it as a secret here, never in this file
        sync: false
      - key: OPEN_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPEN_MODEL
        value: gemini-3-flash-preview
      - key: OPEN_LABEL
        value: Gemini 3 Flash
      - key: OPEN_HOST
        value: Google AI Studio
      - key: OPEN_RPM  # the free tier allows 5 requests a minute for this model
        value: "4"
      - key: LIVE_CODE  # live runs need this code; give it to judges. Samples never do
        sync: false
      # Free-tier Gemini 3 Flash allows 20 requests a day, about three checks. Raise these after enabling billing.
      - key: RUNS_PER_HOUR
        value: "2"
      - key: RUNS_PER_DAY
        value: "6"
